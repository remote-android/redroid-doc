name: webrtc

on:
  push:
    paths:
      - "webrtc/**"
      - ".github/workflows/webrtc.yml"
  pull_request:
    paths:
      - "webrtc/**"
      - ".github/workflows/webrtc.yml"
  workflow_dispatch:

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds cuttlefish's WebRTC stack plus redroid_webrtc and runs the unit
      # tests (SKIP_TESTS empty).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: webrtc
          file: webrtc/docker/Dockerfile
          build-args: SKIP_TESTS=
          tags: redroid/webrtc:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}

      # No binder on the runners: stream the test pattern and check that the
      # device registers with the operator and its page is served.
      - name: Smoke test
        run: |
          docker run -d --name webrtc --network host \
            -e REDROID_DEVICES=smoke=127.0.0.1:5555 \
            -e STREAMER_ARGS=--source=test_pattern \
            redroid/webrtc:ci
          for i in $(seq 30); do
            if curl -sf http://127.0.0.1:8080/devices | grep -q '"smoke"'; then
              break
            fi
            sleep 2
          done
          docker logs webrtc 2>&1 | tail -20
          curl -sf http://127.0.0.1:8080/devices | grep -q '"smoke"'
          curl -sf http://127.0.0.1:8080/devices/smoke/files/client.html | grep -qi '<html'
          curl -sfk https://127.0.0.1:8443/ | grep -q 'redroid devices'

  # Compiles the camera provider and the gralloc wrapper for each architecture
  # and checks that the image still holds what the device needs. It cannot boot
  # Android here: there is no binder on the runners.
  camera:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The build stage is always amd64, which arm64 runners have to emulate.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: webrtc/camera-hal
          tags: redroid/redroid:camera-ci
          load: true
          cache-from: type=gha,scope=camera-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=camera-${{ matrix.runner }}

      - name: Check the installed files
        run: |
          docker create --name camera redroid/redroid:camera-ci
          for f in \
            vendor/bin/hw/android.hardware.camera.provider-service.redroid \
            vendor/lib64/hw/gralloc.redroid.so \
            vendor/lib64/hw/gralloc.redroid-real.so \
            vendor/etc/init/redroid-camera.rc \
            vendor/etc/vintf/manifest/redroid-camera.xml \
            vendor/etc/permissions/android.hardware.camera.xml; do
            docker cp "camera:/$f" - | tar -tf - > /dev/null
          done
